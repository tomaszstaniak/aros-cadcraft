id              = "cadcraft"
version         = "0.20.1"
summary         = "2D CAD drafting for DWG and DXF drawings with PDF and SVG export"
category        = "graphics/cad"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "aarch64"
abi             = "v1"
subdir          = "CADCraft"
icon            = "CADCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "Native Raspberry Pi build (nightly 2026-11-10). Tested in an emulator only.",
  "The CPU draws the whole window on every change, so the interface reacts with a delay on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, autosave files and CADCraft.log are kept in CADCraftData in the program drawer; keep it when upgrading.",
  "Updates come through the AROS package manager.",
]

# System libraries the programs open: C runtime first, then window, pictures and requesters.

[[requires_system]]
type = "library"
id   = "stdc.library"

[[requires_system]]
type = "library"
id   = "posixc.library"

[[requires_system]]
type = "library"
id   = "stdcio.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-cadcraft"
revision   = "v0.20.1"
archive    = "CADCraft-0.20.1-source.zip"
built_with = "Raspberry Pi AArch64 ABIv1 (nightly 2026-11-10 SDK), Clang 20.1.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "CADCraft"
mode       = "workbench"
